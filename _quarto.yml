project:
  type: website
  output-dir: _site
  pre-render: Rscript run-all.R
  resources:
    - data/clean/**
    - data/raw/**

website:
  title: "EPI Data Dashboard"
  navbar:
    logo: images/epi-logo.png
    background: "#1C2B4A"
    foreground: "#FFFFFF"
    left:
      - href: index.qmd
        text: Overview
      - href: schools.qmd
        text: School Profiles
      - href: visits.qmd
        text: Visits
      - href: surveys.qmd
        text: Student Surveys
      - href: new-projects.qmd
        text: New Projects
      - href: results.qmd
        text: Results
      - href: issues.qmd
        text: Issues

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    include-in-header:
      # Vercel Web Analytics (static-site method). Only active when served
      # from Vercel with Web Analytics enabled; harmless everywhere else.
      text: |
        <script defer src="/_vercel/insights/script.js"></script>
