name: Update Dashboard Data

on:
  schedule:
    # Runs every day at 6:00 AM UTC (1:00 AM EST / 6:00 AM Ghana time)
    - cron: "0 6 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest

    env:
      SHEET_SCHOOLS_OVERVIEW: ${{ secrets.SHEET_SCHOOLS_OVERVIEW }}
      SHEET_QUICK_UPDATE: ${{ secrets.SHEET_QUICK_UPDATE }}
      SHEET_FULL_UPDATE: ${{ secrets.SHEET_FULL_UPDATE }}
      SHEET_STUDENT_SURVEY: ${{ secrets.SHEET_STUDENT_SURVEY }}
      SHEET_NEW_PROJECT: ${{ secrets.SHEET_NEW_PROJECT }}
      R_LIBS_USER: /home/runner/R/library

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.0"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Install R packages
        run: |
          mkdir -p $R_LIBS_USER
          Rscript -e '
            options(repos = c(RSPM = "https://packagemanager.posit.co/cran/__linux__/jammy/latest", CRAN = "https://cloud.r-project.org"))
            install.packages(c("tidyverse", "googlesheets4", "jsonlite", "here", "dotenv"), lib = Sys.getenv("R_LIBS_USER"))
            cat("Library paths:\n")
            cat(.libPaths(), sep = "\n")
          '

      - name: Create .env file from secrets
        run: |
          printf 'SHEET_SCHOOLS_OVERVIEW="%s"\nSHEET_QUICK_UPDATE="%s"\nSHEET_FULL_UPDATE="%s"\nSHEET_STUDENT_SURVEY="%s"\nSHEET_NEW_PROJECT="%s"\n' \
            "$SHEET_SCHOOLS_OVERVIEW" "$SHEET_QUICK_UPDATE" "$SHEET_FULL_UPDATE" "$SHEET_STUDENT_SURVEY" "$SHEET_NEW_PROJECT" > .env
          cat .env

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Verify R can load packages
        run: |
          Rscript -e 'library(tidyverse); cat("tidyverse loaded OK\n"); cat(.libPaths(), sep = "\n")'

      - name: Render site
        run: quarto render

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet _site/ data/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if data changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _site/ data/clean/
          git commit -m "Auto-update dashboard data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
