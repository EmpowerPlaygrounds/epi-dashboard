name: Update Dashboard Data

on:
  schedule:
    # Runs every day at 6:00 AM UTC (1:00 AM EST / 6:00 AM Ghana time)
    - cron: "0 6 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest

    env:
      SHEET_SCHOOLS_OVERVIEW: ${{ secrets.SHEET_SCHOOLS_OVERVIEW }}
      SHEET_QUICK_UPDATE: ${{ secrets.SHEET_QUICK_UPDATE }}
      SHEET_FULL_UPDATE: ${{ secrets.SHEET_FULL_UPDATE }}
      SHEET_STUDENT_SURVEY: ${{ secrets.SHEET_STUDENT_SURVEY }}
      SHEET_NEW_PROJECT: ${{ secrets.SHEET_NEW_PROJECT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.0"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("tidyverse", "googlesheets4", "jsonlite", "here", "dotenv"), repos = "https://cloud.r-project.org")'

      - name: Create .env file from secrets
        run: |
          cat <<EOF > .env
          SHEET_SCHOOLS_OVERVIEW="$SHEET_SCHOOLS_OVERVIEW"
          SHEET_QUICK_UPDATE="$SHEET_QUICK_UPDATE"
          SHEET_FULL_UPDATE="$SHEET_FULL_UPDATE"
          SHEET_STUDENT_SURVEY="$SHEET_STUDENT_SURVEY"
          SHEET_NEW_PROJECT="$SHEET_NEW_PROJECT"
          EOF

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet _site/ data/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if data changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _site/ data/clean/
          git commit -m "Auto-update dashboard data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
