function inRange(dateStr, start, end) {
  if (!dateStr) return false;
  var d = dateStr.slice(0, 10);
  return d >= start && d <= end;
}

function renderVisitPage() {
  var start = document.getElementById("date-start").value;
  var end   = document.getElementById("date-end").value;
  var filtered = VISITS.filter(function(v) { return inRange(v.visit_date, start, end); });

  // --- Pie chart: % schools visited ---
  var visitedSchools = {};
  filtered.forEach(function(v) { if (v.school_name) visitedSchools[v.school_name] = true; });
  var nVisited = Object.keys(visitedSchools).length;
  var nNotVisited = N_TOTAL - nVisited;

  if (visitedPieChart) visitedPieChart.destroy();
  var canvas = document.getElementById("visited-pie");
  visitedPieChart = new Chart(canvas, {
    type: "pie",
    data: {
      labels: ["Visited (" + nVisited + ")", "Not Visited (" + nNotVisited + ")"],
      datasets: [{
        data: [nVisited, nNotVisited],
        backgroundColor: ["#1C2B4A", "#e9ecef"]
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        legend: { position: "bottom", labels: { font: { size: 12 } } },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              var pct = N_TOTAL > 0 ? Math.round(ctx.raw / N_TOTAL * 100) : 0;
              return ctx.label + " - " + pct + "%";
            }
          }
        }
      }
    }
  });

  var pctVisited = N_TOTAL > 0 ? Math.round(nVisited / N_TOTAL * 100) : 0;
  document.getElementById("visited-summary").textContent = nVisited + " of " + N_TOTAL + " schools visited (" + pctVisited + "%)";

  // --- Visit Log DataTable ---
  if (logDT) { logDT.destroy(); document.getElementById("visit-log-table").innerHTML = ""; }
  var logData = filtered.map(function(v) {
    return [v.visit_date || "", v.school_name || "", v.visitor || "", v.visit_reason || "", v.activities || ""];
  });
  logDT = jQuery("#visit-log-table").DataTable({
    data: logData,
    columns: [
      { title: "Date", width: "100px" },
      { title: "School", width: "140px" },
      { title: "Staff Member", width: "100px" },
      { title: "Visit Reason" },
      { title: "Activities" }
    ],
    pageLength: 15,
    order: [[0, "desc"]],
    dom: "lfrtip",
    autoWidth: false
  });

  // --- Visits by School (include 0-visit schools) ---
  if (bySchoolDT) { bySchoolDT.destroy(); document.getElementById("visits-by-school-table").innerHTML = ""; }
  var schoolCounts = {};
  ALL_SCHOOLS.forEach(function(s) { schoolCounts[s] = 0; });
  filtered.forEach(function(v) { if (v.school_name && schoolCounts.hasOwnProperty(v.school_name)) schoolCounts[v.school_name]++; });
  var bySchoolData = Object.keys(schoolCounts).sort().map(function(s) { return [s, schoolCounts[s]]; });

  bySchoolDT = jQuery("#visits-by-school-table").DataTable({
    data: bySchoolData,
    columns: [
      { title: "School" },
      { title: "Visits", width: "80px" }
    ],
    pageLength: 15,
    order: [[1, "desc"]],
    dom: "lfrtip"
  });
}

// Initial render + event listeners
document.addEventListener("DOMContentLoaded", function() {
  renderVisitPage();
  document.getElementById("btn-apply-dates").addEventListener("click", renderVisitPage);
  document.getElementById("btn-reset-dates").addEventListener("click", function() {
    var now = new Date();
    document.getElementById("date-start").value = now.getFullYear() + "-01-01";
    document.getElementById("date-end").value = now.toISOString().slice(0, 10);
    renderVisitPage();
  });
});
