// Display order within each group (items with 0 in the range are hidden)
var DIST_ORDER  = ["lanterns", "science_kits", "menstrual_kits", "computers", "solar_panels", "library_books", "lantern_groups", "rooms", "toilets"];
var BUILT_ORDER = ["mgr_generating", "mgr_nongenerating", "construction", "borehole", "starlink", "rachel", "library", "grow"];

function inRange(dateStr, start, end) {
  if (!dateStr) return false;
  var d = dateStr.slice(0, 10);
  return d >= start && d <= end;
}

function tile(label, value) {
  return '<div style="background:#fff; border-radius:8px; padding:1.25rem 1rem; box-shadow:0 2px 8px rgba(0,0,0,0.08); text-align:center;">'
    + '<span style="font-size:2rem; font-weight:700; color:var(--epi-navy); display:block; line-height:1.1;">' + value.toLocaleString() + '</span>'
    + '<span style="color:#666; font-size:0.85rem;">' + label + '</span></div>';
}

function renderImpact() {
  var start = document.getElementById("imp-date-start").value;
  var end   = document.getElementById("imp-date-end").value;

  var filtered = ITEMS.filter(function(it) { return inRange(it.project_date, start, end); });

  var totals = {}, labels = {};
  filtered.forEach(function(it) {
    totals[it.item_key] = (totals[it.item_key] || 0) + Number(it.quantity || 0);
    labels[it.item_key] = it.item_label;
  });

  function renderGroup(order, containerId) {
    var html = "";
    order.forEach(function(key) {
      if (totals[key] > 0) html += tile(labels[key] || key, totals[key]);
    });
    document.getElementById(containerId).innerHTML = html;
    return html !== "";
  }

  var anyD = renderGroup(DIST_ORDER, "tiles-distributed");
  var anyB = renderGroup(BUILT_ORDER, "tiles-built");

  document.getElementById("head-distributed").style.display = anyD ? "block" : "none";
  document.getElementById("head-built").style.display = anyB ? "block" : "none";
  document.getElementById("impact-empty").style.display = (!anyD && !anyB) ? "block" : "none";
}

document.addEventListener("DOMContentLoaded", function() {
  renderImpact();

      function throttle(fn, ms) {
      let throttle = false;
      let timer;
        return (...args) => {
          if(!throttle) { // first call gets through
              fn.apply(this, args);
              throttle = true;
          } else { // all the others get throttled
              if(timer) clearTimeout(timer); // cancel #2
              timer = setTimeout(() => {
                fn.apply(this, args);
